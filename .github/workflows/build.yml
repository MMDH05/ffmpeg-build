name: Build ffmpeg-whisper

# - Pull requests / manual runs: build + test both arches, upload as artifacts.
# - Tags (v<ffmpeg>-w<whisper>-r<n>, e.g. v9.0.1-w1.9.4-r1): the same, then
#   publish a GitHub Release that downlodr pins by URL + sha256.
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  # Test-only model; the app ships ggml-small.bin separately.
  TEST_MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # macos-15, not 14: the x64 build uses AVX2, which Rosetta 2 can only
    # emulate from macOS 15 on, and test.sh runs it under Rosetta.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install nasm pkgconf

      - name: Cache source tarballs
        uses: actions/cache@v4
        with:
          path: build/src
          key: src-${{ hashFiles('versions.env') }}

      - name: Build
        run: bash ./build.sh ${{ matrix.arch }}

      - name: Cache test model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ggml-tiny.en.bin
          key: model-ggml-tiny.en

      - name: Fetch test model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: curl -fL --retry 3 -o ggml-tiny.en.bin "$TEST_MODEL_URL"

      - name: Test (transcribe a sample the way downlodr does)
        run: bash ./test.sh ${{ matrix.arch }} ggml-tiny.en.bin

      - name: Record build info
        run: |
          BIN=dist/ffmpeg-whisper-${{ matrix.arch }}
          RUN="$BIN"; [ "${{ matrix.arch }}" = x64 ] && RUN="arch -x86_64 $BIN"
          {
            echo "# ffmpeg-whisper-${{ matrix.arch }}"
            echo
            $RUN -hide_banner -version
            echo
            echo "## Linked libraries"
            otool -L "$BIN"
          } > dist/buildinfo-${{ matrix.arch }}.txt
          cat dist/buildinfo-${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-whisper-${{ matrix.arch }}
          path: |
            dist/ffmpeg-whisper-${{ matrix.arch }}
            dist/ffprobe-${{ matrix.arch }}
            dist/buildinfo-${{ matrix.arch }}.txt
          if-no-files-found: error

      # Only one matrix leg needs to hand the sources to the release job.
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: sources
          path: build/src/*.tar.*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches versions.env
        run: |
          source versions.env
          expected="v${FFMPEG_VERSION}-w${WHISPER_VERSION}-r"
          case "$GITHUB_REF_NAME" in
            "$expected"*) echo "Tag $GITHUB_REF_NAME matches versions.env" ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not start with $expected"; exit 1 ;;
          esac

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          chmod +x ffmpeg-whisper-* ffprobe-*
          sha256sum ffmpeg-whisper-arm64 ffmpeg-whisper-x64 ffprobe-arm64 ffprobe-x64 *.tar.* > SHA256SUMS
          cat SHA256SUMS

      # The exact ffmpeg and whisper.cpp source tarballs are attached to every
      # release alongside build.sh (in this repo at the tag): that is the
      # LGPL-2.1 source offer for the ffmpeg binaries.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source versions.env
          {
            echo "Static, transcription-only ffmpeg ${FFMPEG_VERSION} with the whisper filter (whisper.cpp ${WHISPER_VERSION}) for downlodr on macOS ${MACOSX_DEPLOYMENT_TARGET}+."
            echo
            echo "- \`ffmpeg-whisper-arm64\`: Apple Silicon, Metal + Accelerate"
            echo "- \`ffmpeg-whisper-x64\`: Intel, AVX2 + Accelerate (Haswell or newer)"
            echo "- \`ffprobe-arm64\` / \`ffprobe-x64\`: ffprobe ${FFMPEG_VERSION} from the same build, able to read every container ffmpeg supports"
            echo
            echo "Licence: ffmpeg is LGPL-2.1-or-later (built without --enable-gpl/--enable-nonfree); whisper.cpp is MIT. Sources and build script: the attached tarballs and \`build.sh\` at this tag."
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
